CONFIG_ZMK_KEYBOARD_NAME="moNa2"

# default: 64
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
# Nemu-link motion encoding needs at least 800 bytes of input-thread stack.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_NEMU_LINK=y
CONFIG_ZMK_NEMU_LINK_MODE_SWITCH=y
CONFIG_ZMK_NEMU_LINK_BOOT_ESB=y
CONFIG_ZMK_NEMU_LINK_MODE_CHORD=n
CONFIG_ZMK_NEMU_LINK_PERIPHERAL_ID=1
CONFIG_ZMK_NEMU_LINK_STUDIO_SOURCE=1
CONFIG_ZMK_NEMU_LINK_STUDIO_ENDPOINT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3222=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_RGBLED_WIDGET_INTERVAL_MS=375
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=750
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=750
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_CHARGE_INDICATOR=y
